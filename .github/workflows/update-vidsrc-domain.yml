name: Update VidSrc domain

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update VidSrc domain in sources
        run: node scripts/update-vidsrc-domain.mjs

      - name: Commit changes
        run: |
          if git diff --quiet -- config/sources.json; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/sources.json
          git commit -m "chore: update VidSrc domain"
          git push
